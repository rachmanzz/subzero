version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # MinIO Object Storage (S3-Compatible Storage Provider, PRD 5.3)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: subzero-minio
    ports:
      - "9000:9000" # S3 API endpoint
      - "9001:9001" # Web Console endpoint
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 5

  # One-shot bucket initializer for tenant storage
  minio-init:
    image: minio/mc:latest
    container_name: subzero-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/tenant-vault --ignore-existing;
      mc anonymous set download myminio/tenant-vault;
      exit 0;
      "

  # ----------------------------------------------------------------------------
  # Subzero Admin Management API & Web Dashboard (PRD 3 & 5.5)
  # ----------------------------------------------------------------------------
  subzero-admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    container_name: subzero-admin
    ports:
      - "8080:8080" # Management Dashboard & Compile API
    environment:
      - PORT=8080
      - DATA_DIR=/app/data/wasm
    volumes:
      - wasm-store:/app/data/wasm
    depends_on:
      - minio-init

  # ----------------------------------------------------------------------------
  # Subzero Supervisor Daemon (Task Dispatcher & Scale-to-Zero Coordinator, PRD 5.1 & 8)
  # ----------------------------------------------------------------------------
  subzero-supervisor:
    build:
      context: .
      dockerfile: Dockerfile
      target: supervisor
    container_name: subzero-supervisor
    ports:
      - "9090:9090" # Supervisor TCP Ingress
    command: >
      /usr/local/bin/subzero-supervisor
      -scheme=tcp
      -endpoint=0.0.0.0:9090
      -worker-endpoint=/tmp/subzero-worker.sock
      -spawner=process
      -concurrency=16
      -idle-timeout=15s
    volumes:
      - supervisor-socket:/tmp
      - wasm-store:/app/data/wasm
    depends_on:
      - minio-init

volumes:
  minio-data:
  wasm-store:
  supervisor-socket:
