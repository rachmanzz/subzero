name: Subzero CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.2'
        cache: true

    - name: Verify Dependencies
      run: go mod verify

    - name: Run Tests with Race Detector
      run: make test

    - name: Run Security Vulnerability Check
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
        govulncheck ./...

    - name: Build All Executables
      run: make build

    - name: Verify Binary Outputs
      run: |
        ls -la bin/
        ./bin/subzero-cli -help || true

    - name: Validate Docker Images and Compose Orchestration
      run: |
        docker compose config
        docker build -t subzero-worker:latest -f Dockerfile.worker .
        REQUIRE_DOCKER=1 go test -v -run TestContainerSpawner_RealDocker_IfAvailable ./test/e2e/
